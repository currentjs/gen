name: CI

on:
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:all

  report:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # --test-coverage-exclude needs Node >= 22.5; the test job keeps
          # covering the supported minimum (18).
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Report coverage
        id: coverage
        run: |
          npm run test:coverage:src | tee coverage-output.txt

          summary_line=$(grep '^# all files' coverage-output.txt)
          if [ -z "$summary_line" ]; then
            echo "Could not find the 'all files' summary row in the coverage output" >&2
            exit 1
          fi

          echo "lines=$(echo "$summary_line" | cut -d'|' -f2 | xargs)" >> "$GITHUB_OUTPUT"
          echo "branches=$(echo "$summary_line" | cut -d'|' -f3 | xargs)" >> "$GITHUB_OUTPUT"
          echo "funcs=$(echo "$summary_line" | cut -d'|' -f4 | xargs)" >> "$GITHUB_OUTPUT"

      - name: Run npm audit
        id: audit
        if: always()
        continue-on-error: true
        run: |
          set +e
          npm audit > audit-output.txt 2>&1
          npm audit --json > audit.json 2>/dev/null
          # Never fail the job on findings — they belong in the PR comment.
          exit 0

      # GITHUB_TOKEN is read-only for pull_request events triggered from a
      # fork, regardless of the `permissions` above — this step will fail on
      # those PRs. That's a GitHub platform restriction, not a bug here.
      - name: Comment coverage and audit on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- gen-ci-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const coverageOutcome = '${{ steps.coverage.outcome }}';

            const coverageSection = coverageOutcome === 'success'
              ? [
                  '### Coverage',
                  '',
                  '| Lines | Branches | Functions |',
                  '| --- | --- | --- |',
                  `| ${{ steps.coverage.outputs.lines }}% | ${{ steps.coverage.outputs.branches }}% | ${{ steps.coverage.outputs.funcs }}% |`,
                ].join('\n')
              : `### Coverage\n\n⚠️ Coverage run failed — see the [workflow run](${runUrl}) for details.`;

            const severityOrder = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };

            function formatFix(fixAvailable) {
              if (fixAvailable === true) return 'yes';
              if (fixAvailable && typeof fixAvailable === 'object') {
                const version = fixAvailable.version ? ` → ${fixAvailable.version}` : '';
                return fixAvailable.isSemVerMajor ? `yes (breaking${version})` : `yes${version}`;
              }
              return 'no';
            }

            function buildAuditSection() {
              let counts = { info: 0, low: 0, moderate: 0, high: 0, critical: 0, total: 0 };
              let vulnRows = [];

              try {
                const auditJson = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
                counts = { ...counts, ...(auditJson.metadata?.vulnerabilities || {}) };
                vulnRows = Object.values(auditJson.vulnerabilities || {})
                  .sort((a, b) => (severityOrder[a.severity] ?? 9) - (severityOrder[b.severity] ?? 9))
                  .map((v) => `| ${v.name} | ${v.severity} | ${formatFix(v.fixAvailable)} |`);
              } catch (error) {
                return `### npm audit\n\n⚠️ npm audit failed to produce a report — see the [workflow run](${runUrl}) for details.`;
              }

              const lines = [
                '### npm audit',
                '',
                '| Info | Low | Moderate | High | Critical | Total |',
                '| --- | --- | --- | --- | --- | --- |',
                `| ${counts.info} | ${counts.low} | ${counts.moderate} | ${counts.high} | ${counts.critical} | ${counts.total} |`,
              ];

              if (vulnRows.length > 0) {
                lines.push('', '| Package | Severity | Fix |', '| --- | --- | --- |', ...vulnRows);
              } else {
                lines.push('', 'No known vulnerabilities.');
              }

              if (fs.existsSync('audit-output.txt')) {
                let fullOutput = fs.readFileSync('audit-output.txt', 'utf8').trim();
                const maxChars = 50000;
                if (fullOutput.length > maxChars) {
                  fullOutput = `${fullOutput.slice(0, maxChars)}\n… truncated`;
                }
                const escaped = (fullOutput || '(empty)')
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;');
                lines.push(
                  '',
                  '<details>',
                  '<summary>Full <code>npm audit</code> output</summary>',
                  '',
                  `<pre><code>${escaped}</code></pre>`,
                  '',
                  '</details>',
                );
              }

              return lines.join('\n');
            }

            const body = [
              marker,
              '## CI report (`@currentjs/gen`)',
              '',
              coverageSection,
              '',
              buildAuditSection(),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
